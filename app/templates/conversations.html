{% extends "base.html" %}
{% block title %}Konusmalar{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold text-gray-800 mb-6">Konusmalar</h2>

<!-- Filters -->
<div class="flex gap-4 mb-6">
    <input type="text" id="phone-filter" placeholder="Telefon numarasi..." class="border rounded-lg px-4 py-2 w-64 focus:ring-2 focus:ring-indigo-500 outline-none">
    <select id="channel-filter" class="border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
        <option value="">Tum Kanallar</option>
        <option value="wa">WhatsApp</option>
        <option value="tg">Telegram</option>
        <option value="ig">Instagram</option>
    </select>
    <button onclick="filterConversations()" class="btn-primary btn-icon px-5 py-2"><i data-lucide="filter"></i>Filtrele</button>
</div>

<div class="flex gap-6">
    <!-- Conversation List -->
    <div class="w-1/3 bg-white rounded-xl shadow overflow-hidden">
        <div id="conv-list" class="divide-y max-h-[70vh] overflow-y-auto">
            <p class="p-4 text-gray-400">Yukleniyor...</p>
        </div>
    </div>

    <!-- Chat Detail -->
    <div class="w-2/3 bg-white rounded-xl shadow">
        <div id="chat-header" class="p-4 border-b bg-gray-50 rounded-t-xl">
            <p class="text-gray-500">Bir konusma secin</p>
        </div>
        <div id="chat-messages" class="p-4 max-h-[60vh] overflow-y-auto space-y-3">
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allConversations = [];

async function loadConversations() {
    const res = await fetch('/api/conversations');
    allConversations = await res.json();
    renderList(allConversations);

    // URL'de phone parametresi varsa otomatik ac
    const params = new URLSearchParams(window.location.search);
    const phone = params.get('phone');
    if (phone) {
        document.getElementById('phone-filter').value = phone.replace('tg_','').replace('ig_','');
        showChat(phone);
    }
}

function renderList(conversations) {
    const grouped = {};
    conversations.forEach(m => {
        if (!grouped[m.phone]) grouped[m.phone] = { msgs: [], last: m };
        grouped[m.phone].msgs.push(m);
        if (m.time > grouped[m.phone].last.time) grouped[m.phone].last = m;
    });

    const container = document.getElementById('conv-list');
    container.innerHTML = '';

    const sorted = Object.entries(grouped).sort((a, b) => b[1].last.time.localeCompare(a[1].last.time));

    sorted.forEach(([phone, data]) => {
        const channel = phone.startsWith('tg_') ? '🔵' : phone.startsWith('ig_') ? '📷' : '🟢';
        const displayPhone = phone.replace('tg_', '').replace('ig_', '');
        const last = data.last;
        const time = new Date(last.time + 'Z');
        const h = (time.getUTCHours() + 3) % 24;
        const timeStr = `${h.toString().padStart(2,'0')}:${time.getUTCMinutes().toString().padStart(2,'0')}`;

        container.innerHTML += `
            <div onclick="showChat('${phone}')" class="p-4 cursor-pointer hover:bg-indigo-50 transition">
                <div class="flex items-center justify-between">
                    <span class="font-medium text-gray-700">${channel} ${displayPhone}</span>
                    <span class="text-xs text-gray-400">${timeStr}</span>
                </div>
                <p class="text-sm text-gray-400 truncate mt-1">${last.message.slice(0, 60)}</p>
                <span class="text-xs text-gray-300">${data.msgs.length} mesaj</span>
            </div>
        `;
    });
}

function showChat(phone) {
    const msgs = allConversations.filter(m => m.phone === phone).reverse();
    const channel = phone.startsWith('tg_') ? 'Telegram' : phone.startsWith('ig_') ? 'Instagram' : 'WhatsApp';
    const displayPhone = phone.replace('tg_', '').replace('ig_', '');

    document.getElementById('chat-header').innerHTML = `
        <p class="font-semibold text-gray-700">${displayPhone}</p>
        <p class="text-sm text-gray-400">${channel} - ${msgs.length} mesaj</p>
    `;

    const container = document.getElementById('chat-messages');
    container.innerHTML = '';

    msgs.forEach(m => {
        const isUser = m.role === 'user';
        const time = new Date(m.time + 'Z');
        const h = (time.getUTCHours() + 3) % 24;
        const timeStr = `${h.toString().padStart(2,'0')}:${time.getUTCMinutes().toString().padStart(2,'0')}`;

        container.innerHTML += `
            <div class="flex ${isUser ? 'justify-start' : 'justify-end'}">
                <div class="${isUser ? 'bg-gray-100' : 'bg-indigo-100'} rounded-xl px-4 py-2 max-w-lg">
                    <p class="text-sm text-gray-700 whitespace-pre-wrap">${m.message}</p>
                    <p class="text-xs text-gray-400 mt-1 ${isUser ? 'text-left' : 'text-right'}">${timeStr}</p>
                </div>
            </div>
        `;
    });

    container.scrollTop = container.scrollHeight;
}

function filterConversations() {
    const phone = document.getElementById('phone-filter').value.trim();
    const channel = document.getElementById('channel-filter').value;

    let filtered = allConversations;

    if (phone) {
        filtered = filtered.filter(m => m.phone.includes(phone));
    }
    if (channel === 'wa') {
        filtered = filtered.filter(m => !m.phone.startsWith('tg_') && !m.phone.startsWith('ig_'));
    } else if (channel === 'tg') {
        filtered = filtered.filter(m => m.phone.startsWith('tg_'));
    } else if (channel === 'ig') {
        filtered = filtered.filter(m => m.phone.startsWith('ig_'));
    }

    renderList(filtered);
}

loadConversations();
</script>
{% endblock %}
