<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} - AgentLense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar-link.active { background-color: rgb(17 24 39); color: white; border-color: rgb(99 102 241); }
        .focus-ring:focus { outline: 2px solid rgb(99 102 241); outline-offset: 2px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900">
    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-950 min-h-screen fixed border-r border-slate-800">
            <div class="p-6 border-b border-slate-800">
                <h1 class="text-xl font-semibold text-white">AgentLense</h1>
                <p class="text-slate-400 text-sm mt-1">Operations Console</p>
            </div>
            <nav class="mt-4 px-3 space-y-1">
                <a href="/dashboard" class="sidebar-link flex items-center px-3 py-2.5 rounded-md border border-transparent text-slate-300 hover:bg-slate-900 hover:text-white transition {% if active == 'dashboard' %}active{% endif %}">
                    <span class="mr-3">📊</span> Dashboard
                </a>
                <a href="/dashboard/conversations" class="sidebar-link flex items-center px-3 py-2.5 rounded-md border border-transparent text-slate-300 hover:bg-slate-900 hover:text-white transition {% if active == 'conversations' %}active{% endif %}">
                    <span class="mr-3">💬</span> Konusmalar
                </a>
                <a href="/dashboard/handoffs" class="sidebar-link flex items-center px-3 py-2.5 rounded-md border border-transparent text-slate-300 hover:bg-slate-900 hover:text-white transition {% if active == 'handoffs' %}active{% endif %}">
                    <span class="mr-3">🤝</span> Yonlendirmeler
                </a>
                <a href="/dashboard/agents" class="sidebar-link flex items-center px-3 py-2.5 rounded-md border border-transparent text-slate-300 hover:bg-slate-900 hover:text-white transition {% if active == 'agents' %}active{% endif %}">
                    <span class="mr-3">🤖</span> Agent Ayarlari
                </a>
                <a href="/dashboard/channels" class="sidebar-link flex items-center px-3 py-2.5 rounded-md border border-transparent text-slate-300 hover:bg-slate-900 hover:text-white transition {% if active == 'channels' %}active{% endif %}">
                    <span class="mr-3">📡</span> Kanallar
                </a>
                <a href="/dashboard/routes" class="sidebar-link flex items-center px-3 py-2.5 rounded-md border border-transparent text-slate-300 hover:bg-slate-900 hover:text-white transition {% if active == 'routes' %}active{% endif %}">
                    <span class="mr-3">🧭</span> Rotalar
                </a>
                <a href="/dashboard/knowledge" class="sidebar-link flex items-center px-3 py-2.5 rounded-md border border-transparent text-slate-300 hover:bg-slate-900 hover:text-white transition {% if active == 'knowledge' %}active{% endif %}">
                    <span class="mr-3">📚</span> Bilgi Bankasi
                </a>
            </nav>
            <div class="absolute bottom-4 left-0 right-0 px-6 space-y-4">
                <form method="post" action="/logout">
                    <button class="w-full text-left text-sm text-slate-300 hover:text-white bg-slate-900 hover:bg-slate-800 rounded-md px-3 py-2 transition">Cikis</button>
                </form>
                <div class="text-slate-500 text-xs">
                    <p>WhatsApp: +905428078429</p>
                    <p>Telegram: @kohphangan_inziva_bot</p>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="ml-72 flex-1 p-8">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
