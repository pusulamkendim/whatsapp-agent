{% extends "base.html" %}
{% block title %}Konusmalar{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-4">
    <div>
        <h2 class="text-xl font-semibold text-slate-900">Konusmalar</h2>
        <p class="text-slate-500 mt-0.5">Kanal, agent ve kullanici bazli mesaj gecmisi.</p>
    </div>
    <button onclick="loadConversations()" class="btn-secondary btn-icon px-4 py-2"><i data-lucide="refresh-cw"></i>Yenile</button>
</div>

<div class="grid grid-cols-1 xl:grid-cols-[360px_minmax(0,1fr)] gap-4">
    <aside class="bg-white p-3 min-h-[calc(100vh-180px)]">
        <div class="space-y-2 mb-3">
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                <input type="text" id="phone-filter" placeholder="Kisi, mesaj veya agent ara..." class="w-full border pl-9 pr-3 py-2 text-sm" oninput="filterConversations()">
            </div>
            <div class="grid grid-cols-[1fr_auto] gap-2">
                <select id="channel-filter" class="border px-3 py-2 text-sm" onchange="filterConversations()">
                    <option value="">Tum kanallar</option>
                    <option value="wa">WhatsApp</option>
                    <option value="tg">Telegram</option>
                    <option value="ig">Instagram</option>
                </select>
                <button onclick="filterConversations()" class="btn-primary btn-icon px-3 py-2"><i data-lucide="filter"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <input type="date" id="date-from-filter" class="border px-3 py-2 text-sm" onchange="filterConversations()">
                <input type="date" id="date-to-filter" class="border px-3 py-2 text-sm" onchange="filterConversations()">
            </div>
            <div class="grid grid-cols-3 gap-1">
                <button onclick="setQuickDate('today')" class="btn-secondary px-2 py-1.5 text-xs">Bugun</button>
                <button onclick="setQuickDate('7d')" class="btn-secondary px-2 py-1.5 text-xs">7 gun</button>
                <button onclick="setQuickDate('clear')" class="btn-secondary px-2 py-1.5 text-xs">Temizle</button>
            </div>
        </div>

        <div class="flex items-center justify-between px-1.5 py-2 border-y border-slate-100">
            <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Konusmalar</span>
            <span id="conversation-count" class="text-xs text-slate-400"></span>
        </div>
        <div id="conv-list" class="mt-2 space-y-0.5 max-h-[calc(100vh-340px)] overflow-y-auto">
            <p class="p-3 text-slate-400">Yukleniyor...</p>
        </div>
    </aside>

    <section class="bg-white min-h-[calc(100vh-180px)] overflow-hidden">
        <div id="chat-header" class="sticky top-0 z-10 border-b border-slate-200 bg-white p-4">
            <div class="flex items-center gap-3 text-slate-500">
                <i data-lucide="messages-square" class="w-5 h-5"></i>
                <p>Bir konusma secin</p>
            </div>
        </div>
        <div id="chat-messages" class="p-5 max-h-[calc(100vh-275px)] overflow-y-auto space-y-3 bg-slate-50/60">
        </div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
let allConversations = [];
let groupedConversations = {};
let selectedPhone = null;

async function loadConversations() {
    const res = await fetch('/api/conversations');
    if (!res.ok) {
        convListError(`Konusmalar yuklenemedi: HTTP ${res.status}`);
        return;
    }
    allConversations = await res.json();
    filterConversations();

    const params = new URLSearchParams(window.location.search);
    const phone = params.get('phone');
    if (phone) {
        document.getElementById('phone-filter').value = phone.replace('tg_','').replace('ig_','');
        filterConversations();
        showChat(phone);
    } else if (!selectedPhone) {
        const first = Object.keys(groupedConversations)[0];
        if (first) showChat(first);
    }
}

function convListError(message) {
    document.getElementById('conv-list').innerHTML = `<div class="rounded-xl bg-red-50 px-3 py-3 text-sm text-red-700">${escapeHtml(message)}</div>`;
}

function groupConversations(conversations) {
    const grouped = {};
    conversations.forEach(m => {
        if (!grouped[m.phone]) grouped[m.phone] = { msgs: [], last: m };
        grouped[m.phone].msgs.push(m);
        if ((m.time || '') > (grouped[m.phone].last.time || '')) grouped[m.phone].last = m;
    });
    return Object.fromEntries(
        Object.entries(grouped).sort((a, b) => (b[1].last.time || '').localeCompare(a[1].last.time || ''))
    );
}

function renderList(grouped) {
    groupedConversations = grouped;
    const entries = Object.entries(grouped);
    conversationCount.textContent = `${entries.length} kayit`;
    const container = document.getElementById('conv-list');

    if (!entries.length) {
        container.innerHTML = `<div class="rounded-xl border border-dashed border-slate-300 px-3 py-4 text-sm text-slate-500">Filtreye uygun konusma yok.</div>`;
        renderEmptyChat();
        return;
    }

    container.innerHTML = entries.map(([phone, data]) => {
        const last = data.last;
        const selected = selectedPhone === phone;
        const channel = channelInfo(phone);
        const displayPhone = displayUser(phone);
        const agent = last.agent || 'agent';
        return `
            <button onclick="showChat('${escapeAttr(phone)}')" class="w-full text-left px-3 py-2.5 rounded-xl border-0 ${selected ? 'bg-slate-100' : 'bg-white hover:bg-slate-50'}">
                <div class="flex items-start gap-3">
                    <span class="mt-0.5 grid place-items-center w-8 h-8 rounded-full ${channel.bg} ${channel.text}">
                        <i data-lucide="${channel.icon}" class="w-4 h-4"></i>
                    </span>
                    <span class="min-w-0 flex-1">
                        <span class="flex items-center justify-between gap-2">
                            <span class="font-semibold text-slate-900 truncate">${escapeHtml(displayPhone)}</span>
                            <span class="text-[11px] text-slate-400 whitespace-nowrap">${formatShortDateTime(last.time)}</span>
                        </span>
                        <span class="block text-xs text-slate-500 truncate mt-0.5">${escapeHtml(last.message || '')}</span>
                        <span class="flex items-center gap-2 mt-1">
                            <span class="text-[11px] px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600">${escapeHtml(agent)}</span>
                            <span class="text-[11px] text-slate-400">${data.msgs.length} mesaj</span>
                        </span>
                    </span>
                </div>
            </button>
        `;
    }).join('');
    if (window.lucide) window.lucide.createIcons();
}

function showChat(phone) {
    selectedPhone = phone;
    const grouped = groupedConversations[phone] ? groupedConversations : groupConversations(allConversations);
    const data = grouped[phone];
    if (!data) return;
    const msgs = data.msgs.slice().sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    const channel = channelInfo(phone);
    const displayPhone = displayUser(phone);
    const firstTime = msgs[0]?.time;
    const lastTime = msgs[msgs.length - 1]?.time;

    document.getElementById('chat-header').innerHTML = `
        <div class="flex items-start justify-between gap-4">
            <div class="flex items-start gap-3 min-w-0">
                <span class="grid place-items-center w-10 h-10 rounded-full ${channel.bg} ${channel.text}">
                    <i data-lucide="${channel.icon}" class="w-5 h-5"></i>
                </span>
                <div class="min-w-0">
                    <div class="flex items-center gap-2">
                        <h3 class="font-semibold text-slate-900 truncate">${escapeHtml(displayPhone)}</h3>
                        <span class="text-xs px-2 py-1 rounded-full bg-slate-100 text-slate-600">${channel.name}</span>
                    </div>
                    <p class="text-sm text-slate-500 mt-0.5">${msgs.length} mesaj · ${formatDateTime(firstTime)} - ${formatDateTime(lastTime)}</p>
                </div>
            </div>
            <button onclick="copyConversation('${escapeAttr(phone)}')" class="icon-btn" title="Konusmayi kopyala" aria-label="Konusmayi kopyala"><i data-lucide="copy"></i></button>
        </div>
    `;

    const container = document.getElementById('chat-messages');
    container.innerHTML = '';
    let lastDay = '';

    msgs.forEach(m => {
        const day = formatDate(m.time);
        if (day && day !== lastDay) {
            lastDay = day;
            container.innerHTML += `<div class="sticky top-0 z-0 flex justify-center py-2"><span class="rounded-full bg-white border border-slate-200 px-3 py-1 text-xs text-slate-500">${day}</span></div>`;
        }

        const isUser = m.role === 'user';
        container.innerHTML += `
            <div class="flex ${isUser ? 'justify-start' : 'justify-end'}">
                <div class="max-w-[78%] ${isUser ? 'bg-white border border-slate-200' : 'bg-blue-50 border border-blue-100'} rounded-2xl px-4 py-2.5">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-[11px] font-semibold ${isUser ? 'text-slate-500' : 'text-blue-700'}">${isUser ? 'Kullanici' : escapeHtml(m.agent || 'Agent')}</span>
                        <span class="text-[11px] text-slate-400">${formatTime(m.time)}</span>
                    </div>
                    <p class="text-sm text-slate-800 whitespace-pre-wrap leading-6">${escapeHtml(m.message || '')}</p>
                </div>
            </div>
        `;
    });

    renderList(grouped);
    container.scrollTop = container.scrollHeight;
    if (window.lucide) window.lucide.createIcons();
}

function renderEmptyChat() {
    selectedPhone = null;
    chatHeader.innerHTML = `
        <div class="flex items-center gap-3 text-slate-500">
            <i data-lucide="messages-square" class="w-5 h-5"></i>
            <p>Bir konusma secin</p>
        </div>
    `;
    chatMessages.innerHTML = '';
    if (window.lucide) window.lucide.createIcons();
}

function filterConversations() {
    const query = document.getElementById('phone-filter').value.trim().toLowerCase();
    const channel = document.getElementById('channel-filter').value;
    const dateFrom = document.getElementById('date-from-filter').value;
    const dateTo = document.getElementById('date-to-filter').value;
    let filtered = allConversations;

    if (query) {
        filtered = filtered.filter(m =>
            (m.phone || '').toLowerCase().includes(query) ||
            (m.external_user_id || '').toLowerCase().includes(query) ||
            (m.message || '').toLowerCase().includes(query) ||
            (m.agent || '').toLowerCase().includes(query)
        );
    }
    if (channel === 'wa') {
        filtered = filtered.filter(m => !m.phone.startsWith('tg_') && !m.phone.startsWith('ig_'));
    } else if (channel === 'tg') {
        filtered = filtered.filter(m => m.phone.startsWith('tg_'));
    } else if (channel === 'ig') {
        filtered = filtered.filter(m => m.phone.startsWith('ig_'));
    }
    if (dateFrom) {
        const from = new Date(`${dateFrom}T00:00:00`);
        filtered = filtered.filter(m => {
            const date = parseDate(m.time);
            return date && date >= from;
        });
    }
    if (dateTo) {
        const to = new Date(`${dateTo}T23:59:59`);
        filtered = filtered.filter(m => {
            const date = parseDate(m.time);
            return date && date <= to;
        });
    }

    const grouped = groupConversations(filtered);
    renderList(grouped);
    if (selectedPhone && grouped[selectedPhone]) {
        showChat(selectedPhone);
    } else {
        const first = Object.keys(grouped)[0];
        if (first) showChat(first);
    }
}

function setQuickDate(range) {
    const fromInput = document.getElementById('date-from-filter');
    const toInput = document.getElementById('date-to-filter');
    const today = new Date();
    if (range === 'clear') {
        fromInput.value = '';
        toInput.value = '';
    } else if (range === 'today') {
        const value = formatInputDate(today);
        fromInput.value = value;
        toInput.value = value;
    } else if (range === '7d') {
        const from = new Date(today);
        from.setDate(today.getDate() - 6);
        fromInput.value = formatInputDate(from);
        toInput.value = formatInputDate(today);
    }
    filterConversations();
}

function copyConversation(phone) {
    const data = groupedConversations[phone];
    if (!data) return;
    const text = data.msgs
        .slice()
        .sort((a, b) => (a.time || '').localeCompare(b.time || ''))
        .map(m => `[${formatDateTime(m.time)}] ${m.role}: ${m.message}`)
        .join('\n');
    navigator.clipboard?.writeText(text);
}

function channelInfo(phone) {
    if (phone.startsWith('tg_')) return {name: 'Telegram', icon: 'send', bg: 'bg-sky-50', text: 'text-sky-700'};
    if (phone.startsWith('ig_')) return {name: 'Instagram', icon: 'instagram', bg: 'bg-pink-50', text: 'text-pink-700'};
    return {name: 'WhatsApp', icon: 'message-circle', bg: 'bg-emerald-50', text: 'text-emerald-700'};
}

function displayUser(phone) {
    return String(phone || '').replace('tg_', '').replace('ig_', '');
}

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function escapeAttr(value) {
    return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function parseDate(value) {
    if (!value) return null;
    const normalized = /Z$|[+-]\d\d:\d\d$/.test(value) ? value : `${value}Z`;
    const date = new Date(normalized);
    return Number.isNaN(date.getTime()) ? null : date;
}

function formatInputDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

function formatDateTime(value) {
    const date = parseDate(value);
    if (!date) return '';
    return new Intl.DateTimeFormat('tr-TR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
        timeZone: 'Europe/Istanbul'
    }).format(date);
}

function formatShortDateTime(value) {
    const date = parseDate(value);
    if (!date) return '';
    return new Intl.DateTimeFormat('tr-TR', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
        timeZone: 'Europe/Istanbul'
    }).format(date);
}

function formatDate(value) {
    const date = parseDate(value);
    if (!date) return '';
    return new Intl.DateTimeFormat('tr-TR', {
        day: '2-digit',
        month: 'long',
        year: 'numeric',
        timeZone: 'Europe/Istanbul'
    }).format(date);
}

function formatTime(value) {
    const date = parseDate(value);
    if (!date) return '';
    return new Intl.DateTimeFormat('tr-TR', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
        timeZone: 'Europe/Istanbul'
    }).format(date);
}

loadConversations();
</script>
{% endblock %}
