{% extends "base.html" %}
{% block title %}Agent Ayarlari{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div>
        <h2 class="text-xl font-semibold text-slate-900">Agentlar</h2>
        <p class="text-slate-500 mt-1">Prompt, model ve aktiflik ayarlari</p>
    </div>
    <button onclick="openAgentForm()" class="btn-primary btn-icon px-4 py-2"><i data-lucide="plus"></i>Yeni agent</button>
</div>

<div id="agentsGrid" class="grid grid-cols-1 xl:grid-cols-2 gap-6"></div>

<dialog id="agentDialog" class="rounded-lg w-full max-w-4xl p-0 backdrop:bg-slate-950/50">
    <form id="agentForm" class="bg-white p-6 space-y-4">
        <div class="flex items-start justify-between">
            <h3 id="agentFormTitle" class="text-base font-semibold">Agent</h3>
            <button type="button" onclick="agentDialog.close()" class="icon-btn" title="Kapat" aria-label="Kapat"><i data-lucide="x"></i></button>
        </div>
        <input id="agentId" type="hidden">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <label class="space-y-1">
                <span class="text-sm font-medium">Slug</span>
                <input id="agentSlug" class="w-full border rounded-md px-3 py-2">
            </label>
            <label class="space-y-1">
                <span class="text-sm font-medium">Ad</span>
                <input id="agentName" class="w-full border rounded-md px-3 py-2">
            </label>
            <label class="space-y-1">
                <span class="text-sm font-medium">Tip</span>
                <select id="agentType" class="w-full border rounded-md px-3 py-2" data-icon="bot">
                    <option value="retreat" data-icon="sparkles" data-meta="Inziva bilgi ve handoff">retreat</option>
                    <option value="restaurant" data-icon="utensils" data-meta="Menu, sepet ve siparis">restaurant</option>
                    <option value="generic_prompt" data-icon="message-square-text" data-meta="Prompt tabanli agent">generic_prompt</option>
                    <option value="custom_code" data-icon="code-2" data-meta="Kod ile calisan agent">custom_code</option>
                </select>
            </label>
            <label class="space-y-1">
                <span class="text-sm font-medium">Model</span>
                <input id="agentModel" class="w-full border rounded-md px-3 py-2" value="gemini-2.5-flash">
            </label>
            <label class="flex items-center gap-2 md:col-span-4">
                <input id="agentActive" type="checkbox" class="rounded">
                <span class="text-sm font-medium">Aktif</span>
            </label>
            <label class="space-y-1 md:col-span-4">
                <span class="text-sm font-medium">System prompt</span>
                <textarea id="agentPrompt" rows="10" class="w-full border rounded-md px-3 py-2 font-mono text-sm"></textarea>
            </label>
            <label class="space-y-1 md:col-span-4">
                <span class="text-sm font-medium">Knowledge base</span>
                <textarea id="agentKnowledge" rows="6" class="w-full border rounded-md px-3 py-2 font-mono text-sm"></textarea>
            </label>
        </div>
        <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="agentDialog.close()" class="btn-secondary px-4 py-2">Vazgec</button>
            <button class="btn-primary btn-icon px-4 py-2"><i data-lucide="save"></i>Kaydet</button>
        </div>
    </form>
</dialog>
{% endblock %}

{% block scripts %}
<script>
let agents = [];

async function api(path, options = {}) {
    const res = await fetch(path, options);
    if (res.status === 401) location.href = '/login';
    return res;
}

async function loadAgents() {
    agents = await (await api('/api/agents')).json();
    agentsGrid.innerHTML = agents.map(agent => `
        <section class="bg-white border border-slate-200 rounded-lg p-5">
            <div class="flex items-start justify-between gap-4 mb-4">
                <div>
                    <h3 class="text-base font-semibold">${agent.name}</h3>
                    <p class="text-sm text-slate-500">${agent.slug} · ${agent.type} · ${agent.model}</p>
                </div>
                ${statusBadge(agent.active)}
            </div>
            <textarea id="prompt-${agent.id}" rows="8" class="w-full border rounded-md px-3 py-2 font-mono text-xs">${escapeHtml(agent.system_prompt || '')}</textarea>
            <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-2">
                <input id="test-${agent.id}" class="border rounded-md px-3 py-2 text-sm md:col-span-2" placeholder="Test mesaji">
                <button onclick="testAgent(${agent.id})" class="btn-primary btn-icon justify-center px-3 py-2"><i data-lucide="send"></i>Test</button>
            </div>
            <pre id="testResult-${agent.id}" class="mt-3 bg-slate-50 border rounded-md p-3 text-xs min-h-16 overflow-auto"></pre>
            <div class="mt-4 flex justify-end gap-2">
                <button onclick="quickSavePrompt(${agent.id})" class="icon-btn" title="Prompt kaydet" aria-label="Prompt kaydet"><i data-lucide="save"></i></button>
                <button onclick="openAgentForm(${agent.id})" class="icon-btn" title="Duzenle" aria-label="Duzenle"><i data-lucide="pencil"></i></button>
                <button onclick="setAgentActive('${agent.slug}', ${!agent.active})" class="icon-btn" title="${agent.active ? 'Pasife al' : 'Aktif et'}" aria-label="${agent.active ? 'Pasife al' : 'Aktif et'}"><i data-lucide="${agent.active ? 'pause' : 'play'}"></i></button>
                <button onclick="deleteAgent(${agent.id})" class="icon-btn danger" title="Sil" aria-label="Sil"><i data-lucide="trash-2"></i></button>
            </div>
        </section>
    `).join('');
    if (window.lucide) window.lucide.createIcons();
}

function statusBadge(active) {
    return active
        ? '<span class="inline-flex px-2 py-1 rounded bg-emerald-50 text-emerald-700 text-xs font-medium">Aktif</span>'
        : '<span class="inline-flex px-2 py-1 rounded bg-slate-100 text-slate-600 text-xs font-medium">Pasif</span>';
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function openAgentForm(id = null) {
    const agent = agents.find(item => item.id === id);
    agentFormTitle.textContent = agent ? 'Agent duzenle' : 'Yeni agent';
    agentId.value = agent?.id || '';
    agentSlug.value = agent?.slug || '';
    agentSlug.disabled = Boolean(agent);
    agentName.value = agent?.name || '';
    agentType.value = agent?.type || 'generic_prompt';
    agentModel.value = agent?.model || 'gemini-2.5-flash';
    agentActive.checked = agent ? agent.active : true;
    agentPrompt.value = agent?.system_prompt || '';
    agentKnowledge.value = agent?.knowledge_base || '';
    if (window.enhanceSelects) window.enhanceSelects(agentDialog);
    agentDialog.showModal();
}

agentForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const payload = {
        slug: agentSlug.value,
        name: agentName.value,
        type: agentType.value,
        model: agentModel.value,
        active: agentActive.checked,
        system_prompt: agentPrompt.value,
        knowledge_base: agentKnowledge.value
    };
    const id = agentId.value;
    const agent = agents.find(item => item.id === Number(id));
    await api(id ? `/api/agents/${agent.slug}/config` : '/api/agents', {
        method: id ? 'PUT' : 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });
    agentDialog.close();
    loadAgents();
});

async function quickSavePrompt(id) {
    const agent = agents.find(item => item.id === id);
    await api(`/api/agents/${agent.slug}/config`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({system_prompt: document.getElementById(`prompt-${id}`).value})
    });
    loadAgents();
}

async function setAgentActive(slug, active) {
    await api(`/api/agents/${slug}/config`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({active})
    });
    loadAgents();
}

async function deleteAgent(id) {
    if (!confirm('Agent pasife alinsin mi? Bagli route kayitlari da pasife alinir.')) return;
    await api(`/api/agents/${id}`, {method: 'DELETE'});
    loadAgents();
}

async function testAgent(id) {
    const res = await api(`/api/agents/${id}/test`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: document.getElementById(`test-${id}`).value, dry_run: true})
    });
    document.getElementById(`testResult-${id}`).textContent = JSON.stringify(await res.json(), null, 2);
}

loadAgents();
</script>
{% endblock %}
