{% extends "base.html" %}
{% block title %}Kanallar{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div>
        <h2 class="text-xl font-semibold text-slate-900">Kanallar</h2>
        <p class="text-slate-500 mt-1">WhatsApp, Telegram ve Instagram hesaplari</p>
    </div>
    <button onclick="openChannelForm()" class="btn-primary btn-icon px-4 py-2"><i data-lucide="plus"></i>Yeni kanal</button>
</div>

<div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-600">
            <tr>
                <th class="text-left p-3">Kanal</th>
                <th class="text-left p-3">External ID</th>
                <th class="text-left p-3">Credential</th>
                <th class="text-left p-3">Status</th>
                <th class="text-right p-3">Islem</th>
            </tr>
        </thead>
        <tbody id="channelsBody"></tbody>
    </table>
</div>

<dialog id="channelDialog" class="rounded-lg w-full max-w-2xl p-0 backdrop:bg-slate-950/50">
    <form id="channelForm" class="bg-white p-6 space-y-4">
        <div class="flex items-start justify-between">
            <div>
                <h3 id="formTitle" class="text-base font-semibold">Kanal</h3>
                <p class="text-sm text-slate-500">Credential alanini bos birakirsan mevcut deger korunur.</p>
            </div>
            <button type="button" onclick="channelDialog.close()" class="icon-btn" title="Kapat" aria-label="Kapat"><i data-lucide="x"></i></button>
        </div>
        <input id="channelId" type="hidden">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="space-y-1">
                <span class="text-sm font-medium">Tip</span>
                <select id="channelType" class="w-full border rounded-md px-3 py-2" data-icon="radio-tower">
                    <option value="whatsapp" data-icon="message-circle" data-meta="Meta Cloud API">WhatsApp</option>
                    <option value="telegram" data-icon="send" data-meta="Bot API">Telegram</option>
                    <option value="instagram" data-icon="instagram" data-meta="DM webhook">Instagram</option>
                </select>
            </label>
            <label class="space-y-1">
                <span class="text-sm font-medium">Ad</span>
                <input id="channelName" class="w-full border rounded-md px-3 py-2">
            </label>
            <label class="space-y-1">
                <span class="text-sm font-medium">External ID</span>
                <input id="externalId" class="w-full border rounded-md px-3 py-2">
            </label>
            <label class="space-y-1">
                <span class="text-sm font-medium">Gorunen</span>
                <input id="displayIdentifier" class="w-full border rounded-md px-3 py-2">
            </label>
            <label class="space-y-1">
                <span class="text-sm font-medium">Webhook secret</span>
                <input id="webhookSecret" class="w-full border rounded-md px-3 py-2" placeholder="__KEEP__">
            </label>
            <label class="flex items-center gap-2 pt-7">
                <input id="channelActive" type="checkbox" class="rounded">
                <span class="text-sm font-medium">Aktif</span>
            </label>
            <label class="space-y-1 md:col-span-2">
                <span class="text-sm font-medium">Credentials JSON</span>
                <input id="credentialsJson" class="w-full border rounded-md px-3 py-2 font-mono text-sm" placeholder='{"access_token_env":"WHATSAPP_ACCESS_TOKEN"}'>
            </label>
        </div>
        <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="channelDialog.close()" class="btn-secondary px-4 py-2">Vazgec</button>
            <button class="btn-primary btn-icon px-4 py-2"><i data-lucide="save"></i>Kaydet</button>
        </div>
    </form>
</dialog>
{% endblock %}

{% block scripts %}
<script>
let channels = [];

async function loadChannels() {
    const res = await api('/api/channels');
    channels = await res.json();
    channelsBody.innerHTML = channels.map(c => `
        <tr class="border-t border-slate-100">
            <td class="p-3">
                <div class="font-medium">${c.name}</div>
                <div class="text-xs text-slate-500">${c.channel_type} · ${c.display_identifier || '-'}</div>
            </td>
            <td class="p-3 font-mono text-xs">${c.external_id}</td>
            <td class="p-3 font-mono text-xs text-slate-500">${c.credentials_json}</td>
            <td class="p-3">${statusBadge(c.active)}</td>
            <td class="p-3 text-right">
                <div class="inline-flex items-center gap-2">
                    <button onclick="openChannelForm(${c.id})" class="icon-btn" title="Duzenle" aria-label="Duzenle"><i data-lucide="pencil"></i></button>
                    <button onclick="setChannelActive(${c.id}, ${!c.active})" class="icon-btn" title="${c.active ? 'Pasife al' : 'Aktif et'}" aria-label="${c.active ? 'Pasife al' : 'Aktif et'}"><i data-lucide="${c.active ? 'pause' : 'play'}"></i></button>
                    <button onclick="deleteChannel(${c.id})" class="icon-btn danger" title="Sil" aria-label="Sil"><i data-lucide="trash-2"></i></button>
                </div>
            </td>
        </tr>
    `).join('');
    if (window.lucide) window.lucide.createIcons();
}

function statusBadge(active) {
    return active
        ? '<span class="inline-flex px-2 py-1 rounded bg-emerald-50 text-emerald-700 text-xs font-medium">Aktif</span>'
        : '<span class="inline-flex px-2 py-1 rounded bg-slate-100 text-slate-600 text-xs font-medium">Pasif</span>';
}

function openChannelForm(id = null) {
    const c = channels.find(item => item.id === id);
    formTitle.textContent = c ? 'Kanal duzenle' : 'Yeni kanal';
    channelId.value = c?.id || '';
    channelType.value = c?.channel_type || 'whatsapp';
    channelName.value = c?.name || '';
    externalId.value = c?.external_id || '';
    displayIdentifier.value = c?.display_identifier || '';
    webhookSecret.value = '';
    credentialsJson.value = '';
    channelActive.checked = c ? c.active : true;
    if (window.enhanceSelects) window.enhanceSelects(channelDialog);
    channelDialog.showModal();
}

channelForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const payload = {
        channel_type: channelType.value,
        name: channelName.value,
        external_id: externalId.value,
        display_identifier: displayIdentifier.value,
        active: channelActive.checked
    };
    if (webhookSecret.value) payload.webhook_secret = webhookSecret.value;
    if (credentialsJson.value) payload.credentials_json = credentialsJson.value;

    const id = channelId.value;
    await api(id ? `/api/channels/${id}` : '/api/channels', {
        method: id ? 'PUT' : 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });
    showToast('Kanal kaydedildi.', {variant: 'success'});
    channelDialog.close();
    loadChannels();
});

async function setChannelActive(id, active) {
    await api(`/api/channels/${id}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({active})
    });
    showToast(active ? 'Kanal aktif edildi.' : 'Kanal pasife alindi.', {variant: 'success'});
    loadChannels();
}

async function deleteChannel(id) {
    if (!confirmAction('Kanal pasife alinsin mi? Bagli route kayitlari da pasife alinir.')) return;
    await api(`/api/channels/${id}`, {method: 'DELETE'});
    showToast('Kanal pasife alindi.', {variant: 'success'});
    loadChannels();
}

loadChannels();
</script>
{% endblock %}
