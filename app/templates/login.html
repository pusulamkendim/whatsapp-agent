<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giris - AgentLense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        input { border-radius: 16px; }
        input:focus { outline: 2px solid rgba(47, 111, 237, .22); outline-offset: 1px; border-color: #2f6fed; }
        button { border-radius: 999px; background: #2f6fed; min-height: 42px; font-weight: 600; transition: background-color .16s ease, transform .16s ease; }
        button:hover { background: #255fd4; transform: translateY(-1px); }
    </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center text-zinc-950">
    <main class="w-full max-w-sm border border-zinc-200 rounded-[22px] p-7">
        <div class="mb-6">
            <div class="flex items-center gap-3 mb-5">
                <span class="grid place-items-center w-9 h-9 rounded-xl bg-zinc-950 text-white text-sm font-semibold">AL</span>
                <span class="text-xl font-semibold tracking-tight">AgentLense</span>
            </div>
            <h1 class="text-2xl font-semibold">Admin girisi</h1>
            <p class="text-sm text-zinc-500 mt-1">Production console'a devam et.</p>
        </div>
        <form id="loginForm" class="space-y-4">
            <input id="password" type="password" autocomplete="current-password" class="w-full border border-zinc-300 px-4 py-3" placeholder="Admin sifresi">
            <button class="w-full text-white px-4 py-2">Giris</button>
            <p id="error" class="hidden text-sm text-red-600">Giris basarisiz.</p>
        </form>
    </main>
    <script>
    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({password: password.value})
        });
        if (res.ok) {
            location.href = '/dashboard';
        } else {
            error.classList.remove('hidden');
        }
    });
    </script>
</body>
</html>
